function start(){app.innerHTML=`<div class="eyebrow">Documento oficial · Expediente n.º 0001</div><h1>ÉLITE<br>FRANJINEGRA</h1><div class="stamp">ACCESO RESTRINGIDO</div><h3>¿Es usted digno de abrir la Proteína Camuños?</h3><p>El consumo de este suplemento está reservado a miembros acreditados de la <b>prestigiosa Élite Franjinegra</b>.</p><p>Deberá superar <b>10 preguntas</b> de física, cultura, historia y memoria atlética.</p><div class="notice">⚠️ El comité no se responsabiliza de las respuestas incorrectas, del orgullo herido ni de posibles casos de salvonara mal elaborada.</div><button class="btn" id="start">INICIAR EXAMEN DE ADMISIÓN →</button>`;document.getElementById('start').onclick=()=>{stage=0;index=0;question()}}
function advance(){index++;if(index>=Q[stage].length){stage++;index=0}if(stage>=Q.length)final();else question()}
function question(){const q=Q[stage][index],done=Q.slice(0,stage).reduce((n,x)=>n+x.length,0)+index,total=Q.reduce((n,group)=>n+group.length,0),p=Math.round(100*done/total);app.innerHTML=`<div class="eyebrow">Pregunta ${done+1} de ${total}</div><h2>${esc(q.title||names[stage])}</h2><div class="small">Progreso de admisión · ${p}%</div><div class="bar"><div style="width:${p}%"></div></div><div class="prompt">${esc(q.text)}</div>${q.formula?`<div class="formula">${esc(q.formula)}</div>`:''}<form id="form"><label class="eyebrow" for="answer">Su respuesta oficial</label><input id="answer" autocomplete="off" required placeholder="Escriba su respuesta..."><div id="feedback" aria-live="polite"></div><button class="btn" id="check" type="submit">COMPROBAR RESPUESTA →</button><span id="next"></span></form>${q.alternate?'<button class="skip" id="alternate">Solicitar acceso al departamento especial de no físicos</button>':''}<div><button class="btn alt" id="back">← Volver al inicio</button></div>`;document.getElementById('back').onclick=start;if(q.alternate)document.getElementById('alternate').onclick=alternate;document.getElementById('form').onsubmit=e=>{e.preventDefault();if(document.getElementById('check').disabled)return;let a=document.getElementById('answer').value,ok=q.validate?q.validate(a):q.centimeters?/^(?:100|[1-9]\d?)\s*(?:cm|centímetros|centimetros)$/i.test(a.trim()):q.numeric?!pending(q.answer)&&/^\s*\d+\s*$/.test(a)&&num(a)===Number(q.answer):!pending(q.answer)&&q.answer.some(v=>norm(v)===norm(a));document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${esc(ok?q.good:q.bad)}</div>`;if(ok){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true;document.getElementById('next').innerHTML='<button class="btn" type="button" id="continue">CONTINUAR →</button>';document.getElementById('continue').onclick=advance;document.getElementById('continue').focus()}};if(pending(q.answer)){document.getElementById('feedback').innerHTML='<div class="feedback bad">Esta respuesta sigue pendiente de configurar. Puedes saltarla solo en esta vista previa.</div>';if(CONFIG.permitirSaltarPendientes){document.getElementById('next').innerHTML='<button class="btn alt" type="button" id="continue">SALTAR PENDIENTE (PRUEBAS) →</button>';document.getElementById('continue').onclick=advance}}}
function alternate(){app.innerHTML=`<div class="eyebrow">Pregunta 1 de 10 · Protocolo de emergencia</div><h2>Departamento Especial de No Físicos</h2><p>El comité comprende que no todo aspirante posee un doctorado en física cuántica.</p><div class="prompt">Un atleta tira tres vallas, pierde una zapatilla y asegura que «ha hecho buena carrera». ¿Cuántas vallas ha tirado?</div><form id="form"><label class="eyebrow" for="answer">Su respuesta oficial</label><input id="answer" autocomplete="off" required placeholder="Escriba cuántas vallas"><div id="feedback" aria-live="polite"></div><button class="btn" type="submit">RESPONDER →</button><span id="next"></span></form><button class="btn alt" id="back">Volver a física</button>`;document.getElementById('back').onclick=question;document.getElementById('form').onsubmit=e=>{e.preventDefault();const a=document.getElementById('answer');if(a.disabled)return;const ok=/^(?:3|tres)(?: vallas?)?$/.test(norm(a.value));document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'¡Correcto! Tres vallas.':'Incorrecto. Cuenta las vallas derribadas.'}</div>`;if(ok){document.getElementById('answer').disabled=true;e.currentTarget.querySelector('[type=submit]').disabled=true;document.getElementById('next').innerHTML='<button type="button" class="btn" id="continue">CONTINUAR →</button>';const next=document.getElementById('continue');next.onclick=advance;next.focus()}}}
function final(){app.innerHTML=`<div class="eyebrow">Resolución oficial · Aprobado</div><h1>ENHORABUENA,<br>CAMUÑOS</h1><div class="stamp">APTO PARA LA ÉLITE</div><p>Tras una evaluación exhaustiva y de una seriedad absolutamente cuestionable, el comité certifica su pertenencia a la Élite Franjinegra.</p><p>Dani, has dejado huella dentro y fuera de la pista. Las marcas, los récords y las finales están ahí, pero lo mejor es la gente y los recuerdos que te llevas del deporte. Esto va por ti.</p><div class="notice final-clue"><div class="eyebrow">Pista para abrir el candado</div><p><strong>La contraseña es tu marca personal − 1.</strong><br>Por si andabas espabilado y te lo imaginabas.</p></div><p>Puede proceder a abrir su bote de Proteína Camuños.</p><button class="btn" id="restart">REPETIR EXAMEN</button>`;document.getElementById('restart').onclick=start}start();
</script></body></html>
